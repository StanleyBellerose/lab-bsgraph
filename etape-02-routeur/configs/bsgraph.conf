# /etc/dnsmasq.d/bsgraph.conf : DHCP + DNS pour le LAN de l'agence
interface=enp0s9
bind-dynamic
dhcp-range=192.168.10.100,192.168.10.200,255.255.255.0,12h
dhcp-option=option:router,192.168.10.1
# Depuis l'étape 3 : les postes utilisent DC01 comme DNS
dhcp-option=option:dns-server,192.168.10.10
dhcp-option=option:domain-search,bsgraph.local
domain=bsgraph.local
no-resolv
server=1.1.1.1
server=8.8.8.8
